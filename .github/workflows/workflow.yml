name: Frontend Deploy Pipeline 

on:
    push:
        branches: 
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Pnpm
              uses: pnpm/action-setup@v4
              with: 
                 version: 9

            - name: Install Dependencies
              run: pnpm install

            - name: Build Project
              run: pnpm run build